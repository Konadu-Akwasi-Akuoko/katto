[package]
name = "katto"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A Tauri App"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "katto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
katto-engine = {path ="../crates/katto-engine"}
# rusqlite 0.40 needs rusqlite_migration 2.6, which requires Rust 1.95; pinned to
# the 0.39 pair that builds on the current 1.92 toolchain. Bump both together.
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5.0"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
