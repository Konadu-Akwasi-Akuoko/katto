name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Mirrors the Rust half of `just check` 1:1 from the workspace root.
  # Runs on macOS: Phase 2 lands macOS-only deps (objc2, objc2-user-notifications).
  # macos-latest -> macos-26 image ships Xcode CLT preinstalled, the only Tauri
  # macOS build prerequisite, so no setup step is needed.
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  # Mirrors the frontend half of `just check` (biome, tsc, vitest) plus a
  # production-bundle sanity build.
  frontend:
    name: Frontend (biome, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: biome
        run: bunx biome ci .

      - name: Type check
        run: bunx tsc --noEmit

      - name: vitest
        run: bunx vitest run

      - name: Build
        run: bun run build
